<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Baguettes</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <hr color="orange">
        <h1>Realiza tu pedido de Baguettes</h1>
        <hr color="orange">
    </header>


    <div class="container">
    <form id="pedidoForm" action="">

        <label for="especialidad">Especialidad:</label>
        <select name="especialidad" id="especialidad">
            <option value="Clasica">Clasica (79.99 MXN)</option>
            <option value="bbq">BBQ (99.99 MXM)</option>
            <option value="tocino">Tocino (119.99)</option>
            <option value="doble">Doble Tamaño (149.99 MXN)</option>
            <option value="hawaiana">Hawaiana (179.99 MXN)</option>
        </select> 

        <br>
        <label for="Tipo-pan">Tipo de pan: </label>
        <input type="radio" name="pan" id="pan" value="Clásico">Clásico
        <input type="radio" name="pan" id="pan" value="ajonjolí">Con ajonjolí(+19.99 MXN)
        <input type="radio" name="pan" id="pan" value="Integral">Integral (+20.99 MXN)
        <input type="radio" name="pan" id="pan" value="Brioche">Brioche (+50.99 MXN)

    <br>
    <label for>Ingredientes adicionales (5.00 MXN c/u)</label>
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="queso" id="queso" value="queso">Queso

    <br>

    <label for="cantidad">Cantidad de Baguettes</label>
    <input type="number" name="cantidad" id="cantidad" required min="1" value="1">

    <br>

    <label for="domicilio">
        <input type="checkbox" name="domicilio" id="domicilio">
        ¿Es a domicilio? (+29.99 MXN)
    </label>
    
    <div class="Total" id="Total">
        Total: $0.00 MXN

    </form>
    </div>

    </div>

</body>

</html>
