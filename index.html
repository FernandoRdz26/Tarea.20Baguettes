<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Baguettes</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <hr color="orange">
        <h1>Realiza tu pedido de Baguettes</h1>
        <hr color="orange">
    </header>


    <div class="container">
    <form id="pedidoForm" action="">

        <label for="especialidad">Especialidad:</label>
        <select name="especialidad" id="especialidad">
            <option value="clasica">Clasica (79.99 MXN)</option>
            <option value="bbq">BBQ (99.99 MXM)</option>
            <option value="tocino">Tocino (119.99)</option>
            <option value="doble">Doble Tamaño (149.99 MXN)</option>
            <option value="hawaiana">Hawaiana (179.99 MXN)</option>
        </select> 

        <br>
        <label for="tipopan">Tipo de pan: </label>
        <input type="radio" name="pan" id="pan" value="Clásico">Clásico
        <input type="radio" name="pan" id="pan" value="ajonjolí">Con ajonjolí(+19.99 MXN)
        <input type="radio" name="pan" id="pan" value="Integral">Integral (+20.99 MXN)
        <input type="radio" name="pan" id="pan" value="Brioche">Brioche (+50.99 MXN)

    <br>
    <label for>Ingredientes adicionales (5.00 MXN c/u)</label>
    <input type="checkbox" name="queso" id="queso" value="queso">Queso
    <input type="checkbox" name="lechuga" id="lechuga" value="lechuga">Lechuga
    <input type="checkbox" name="jitomate" id="jitomate" value="jitomate">Jitomate
    <input type="checkbox" name="cebolla" id="cebolla" value="cebolla">Cebolla
    <input type="checkbox" name="jalapeño" id="jalapeño" value="jalapeño">Jalapeño
    <input type="checkbox" name="huevo" id="huevo" value="huevo">Huevo
    <input type="checkbox" name="pepino" id="pepino" value="pepino">Pepino
    <input type="checkbox" name="champiñones" id="champiñones" value="champiñones">Champiñones
    <input type="checkbox" name="tocino" id="tocino" value="tocino">Tocino extra
    <input type="checkbox" name="doblequeso" id="doblequeso" value="doblequeso">Doble queso
    <input type="checkbox" name="piña" id="piña" value="piña">Piña
    <input type="checkbox" name="guacamole" id="guacamole" value="guacamole">Guacamole
    <input type="checkbox" name="bbq" id="bbq" value="bbq">Salsa BBQ
    <input type="checkbox" name="chipotle" id="chipotle" value="chipotle">Aderezo Chipotle
    <input type="checkbox" name="mayonesa" id="mayonesa" value="mayonesa">Mayonesa
    <input type="checkbox" name="mostaza" id="mostaza" value="mostaza">Mostaza
    <input type="checkbox" name="peperoni" id="peperoni" value="peperoni">Peperoni
    <input type="checkbox" name="ketchup" id="ketchup" value="ketchup">Ketchup

    <br>

    <label for="cantidad">Cantidad de Baguettes</label>
    <input type="number" name="cantidad" id="cantidad" required min="1" value="1">

    <br>

    <label for="domicilio">
        <input type="checkbox" name="domicilio" id="domicilio">
        ¿Es a domicilio? (+29.99 MXN)
    </label>
    <br>
    
        <label for="total">Total a pagar:</label>
        <input type="text" name="total" id="total" readonly>

    <br>
    <button type="submit" onclick="calcular()">Calcular Total</button>
    
    </form>
    </div>

    </div>

<script src="script.js"></script>

</body>

</html>
